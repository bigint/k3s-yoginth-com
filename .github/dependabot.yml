version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types:
          - 'version-update:semver-major'
      - dependency-name: nginxinc/nginx-unprivileged
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
